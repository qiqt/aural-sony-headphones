[Warnings]
# Hp, App and Platform are C++ context properties (see qt/main.cpp). qmllint cannot see
# context properties at all, so every use of them is reported as an unqualified access -
# ~160 false positives that drown out the warnings worth reading. Disable the category
# rather than sprinkle pragmas; if these ever become registered QML singletons, delete
# this line and the check becomes useful again.
UnqualifiedAccess=disable

[General]
AdditionalQmlImportPaths=
DisableDefaultImports=false
OverwriteWarningLevel=false
