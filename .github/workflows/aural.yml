name: Aural

on:
  push:
    branches: [main]
    paths:
      - 'Client/**'
      - 'packaging/**'
      - 'LICENSE'
      - '.github/workflows/aural.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Client/**'
      - 'packaging/**'
      - 'LICENSE'
      - '.github/workflows/aural.yml'
  workflow_dispatch:

concurrency:
  group: aural-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.8.3

jobs:
  engine-tests:
    name: Engine tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S Client/tests -B build/tests -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/tests --config Release --parallel

      - name: Test
        run: ctest --test-dir build/tests -C Release --output-on-failure

  aural-app:
    name: Aural app (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake -S Client/qt -B build/aural -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build/aural --config Release --parallel

      - name: Controller tests
        run: ctest --test-dir build/aural -C Release --output-on-failure

      - name: QML lint
        shell: pwsh
        run: |
          $files = Get-ChildItem Client/qt/qml/*.qml | ForEach-Object { $_.FullName }
          qmllint -I build/aural -W 0 @files

      - name: Build portable ZIP
        run: cmake --build build/aural --config Release --target aural_archive

      - name: Smoke-check the staged folder
        shell: pwsh
        run: |
          $pkg = "build/aural/package/Aural"
          $required = @(
            "appAural.exe",
            "Qt6Core.dll", "Qt6Gui.dll", "Qt6Widgets.dll", "Qt6Qml.dll", "Qt6Quick.dll",
            "Qt6QuickControls2.dll", "Qt6Svg.dll",
            "platforms/qwindows.dll",
            "qml/QtQuick/Controls/Basic/qmldir",
            "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll",
            "BUILD-INFO.txt", "LICENSE.txt", "THIRD-PARTY-NOTICES.md",
            "licenses/LGPL-3.0-only.txt", "licenses/GPL-3.0-only.txt"
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $pkg $_)) }
          if ($missing) {
            Write-Host "Missing from the staged folder:"
            $missing | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "Staged folder looks complete ($((Get-ChildItem -Recurse -File $pkg).Count) files)."
          Get-Content (Join-Path $pkg "BUILD-INFO.txt")

      - name: Check package version
        shell: pwsh
        run: |
          $source = Get-Content Client/qt/CMakeLists.txt -Raw
          $version = [regex]::Match($source, 'project\(Aural VERSION ([0-9]+\.[0-9]+\.[0-9]+)').Groups[1].Value
          if (-not $version) { throw "Missing project version" }
          $pkg = "build/aural/package/Aural"
          $exe = (Get-Item "$pkg/appAural.exe").VersionInfo
          if ($exe.ProductVersion -ne $version -or $exe.FileVersion -ne $version) {
            throw "Executable version does not match $version"
          }
          $revision = $env:GITHUB_SHA.Substring(0, 10)
          $info = Get-Content "$pkg/BUILD-INFO.txt" -Raw
          if (-not $info.Contains("Aural $version") -or -not $info.Contains("Source revision : $revision")) {
            throw "Build information does not match this version and commit"
          }
          if (-not (Test-Path "build/aural/Aural-$version-$revision-win-x64.zip")) {
            throw "Missing versioned ZIP"
          }
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag does not match v$version"
          }

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: aural-win-x64-${{ github.sha }}
          path: build/aural/Aural-*-win-x64.zip
          if-no-files-found: error
